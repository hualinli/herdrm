name: HerdrM
options:
  bundleIdPrefix: dev.bybee
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  developmentRegion: en
  knownRegions:
    - en
    - zh-Hans
packages:
  HerdrKit:
    path: Packages/HerdrKit
  HerdrSSH:
    path: Packages/HerdrSSH
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # 1.19 ships the marked-text overlay used for IME preedit; do not reimplement it.
    from: "1.19.0"
targets:
  HerdrM:
    type: application
    platform: macOS
    sources:
      - Sources/HerdrM
      - path: Resources
        buildPhase: resources
        excludes:
          - Localizable.xcstrings
      - path: Resources/Localizable.xcstrings
      - path: Tools/tsnet-proxy/NOTICE
        buildPhase: resources
    dependencies:
      - package: HerdrKit
      - package: SwiftTerm
    postBuildScripts:
      - name: Build embedded tsnet helper
        script: "${SRCROOT}/Tools/tsnet-proxy/build.sh"
        shell: /bin/sh
        basedOnDependencyAnalysis: false
    info:
      path: Sources/HerdrM/Info.plist
      properties:
        CFBundleName: herdrm
        CFBundleDisplayName: herdrm
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 MOE AI LLC"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.herdrm
        PRODUCT_NAME: herdrm
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.10"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: NCFNX3LJ83
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Debug:
          # personal fork builds are ad-hoc signed; no Developer ID needed
          CODE_SIGN_IDENTITY: "-"
          ONLY_ACTIVE_ARCH: YES
        Release:
          CODE_SIGN_IDENTITY: "-"
          ONLY_ACTIVE_ARCH: NO
          ARCHS: "arm64"

  HerdrMobile:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources/HerdrMobile
    dependencies:
      - package: HerdrKit
      - package: HerdrSSH
      - package: SwiftTerm
    info:
      path: Sources/HerdrMobile/Info.plist
      properties:
        CFBundleName: herdrm
        CFBundleDisplayName: herdrm
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: >-
          herdrm connects to your Macs over SSH on your local network to reach
          the herdr session running on them.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.herdrm.ios
        PRODUCT_NAME: HerdrMobile
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.10"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: NCFNX3LJ83
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # The bundled libssh2/OpenSSL xcframeworks ship arm64 device + arm64
        # simulator slices only (see Packages/HerdrSSH/Artifacts/PROVENANCE.md).
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        EXCLUDED_ARCHS__sdk_iphonesimulator__: x86_64
